services:
  - type: web
    name: fsad-backend
    runtime: docker
    rootDir: SpringBootBackend
    dockerfilePath: Dockerfile
    plan: free
    envVars:
      - key: PORT
        value: 10000
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: MAIL_HOST
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: 587
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: AUTH_OTP_MAIL_REQUIRED
        value: true
      - key: JPA_SHOW_SQL
        value: false
      - key: LOG_LEVEL
        value: INFO
      - key: APP_LOG_LEVEL
        value: INFO
      - key: CORS_ALLOWED_ORIGINS
        sync: false

  - type: web
    name: fsad-frontend
    runtime: static
    rootDir: frontend
    staticPublishPath: dist
    buildCommand: npm install && npm run build
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
