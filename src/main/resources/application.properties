spring.application.name=SpringBootBackend

# Server Configuration
server.port=${PORT:10000}

# Database Configuration (Use environment variables in production)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:springbootbackend}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Hibernate/JPA Configuration
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# SMTP Configuration for OTP email
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Authentication Configuration
auth.otp.mail-required=${AUTH_OTP_MAIL_REQUIRED:true}

# JWT Configuration
jwt.secret=${JWT_SECRET:my-default-jwt-secret-key-please-change-in-production-1234567890}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Logging Configuration (Set to INFO in production)
logging.level.root=${LOG_LEVEL:INFO}
logging.level.com.klef.fsad=${APP_LOG_LEVEL:INFO}

# CORS Configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
